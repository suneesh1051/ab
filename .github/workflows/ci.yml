name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v2

      - name: Install Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22'

      - name: Install packages
        working-directory: backend
        run: npm ci


      - name: Run the tests
        working-directory: backend
        run: npm test


  frontend:
    runs-on: ubuntu-latest


    steps:
      - name: Get the code
        uses: actions/checkout@v5


      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22


      - name: Install packages
        working-directory: frontend
        run: npm ci


      - name: Run the tests
        working-directory: frontend
        run: npm test